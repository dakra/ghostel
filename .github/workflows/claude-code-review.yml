name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.comment.body, 'review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Perform a comprehensive code review of this PR.

            ## Project context

            ghostel is a two-layer Emacs terminal package:
            - `lisp/` — Emacs Lisp sources (the `ghostel` package).
            - `src/` — Zig native module wrapping libghostty (the
              terminal engine). Read `src/CLAUDE.md` before commenting
              on any `.zig` file; it documents renderer ownership of
              dirty state, error handling, and Emacs-call conventions.
            - `extensions/<pkg>/` — independent MELPA packages that
              depend on ghostel (currently `evil-ghostel` and
              `consult-ghostel`).
            - `etc/terminfo/`, `etc/shell/` — bundled terminfo and
              shell integration assets (bash, zsh, fish, nushell).

            Elisp calls Zig functions (e.g. `ghostel--write-vt`,
            `ghostel--redraw`). Zig calls back into Elisp via a stashed
            env pointer that is only valid during an Elisp→Zig call.
            Local terminals use a native PTY: a reader thread
            (`src/NativeProcess.zig`) parses output off the Emacs
            thread and reports to Elisp only through an event pipe, so
            it must never touch the Emacs env.

            All packages support Emacs 28.1+ (CI runs 28.2 and 29.4).
            Newer Emacs APIs need `compat` or a `fboundp`/`boundp`
            guard, and every `lisp/` file using a compat-provided
            macro needs its own `(require 'compat)`.

            Tests are ERT-based in per-topic `test/ghostel-*-test.el`
            files (shared helpers in `test/ghostel-test-helpers.el`),
            split by ERT tag into:
            - elisp-only (`make test`) — fast, no native module needed.
            - native (`make test-native`, tagged `native`) — requires
              the Zig build.
            Native tests use `ghostel--write-vt` to feed VT data
            without a live PTY. Pre-commit convention is `make -j8 all`
            (build + all tests + lint).

            ## Rules for findings

            - Verify before claiming. If you assert that a tag, version,
              API, permission, or behavior is wrong/missing/required,
              verify it with WebFetch, `gh api`, or by reading the
              actual source/file. State what you checked.
            - Calibrate. If you are under ~80% confident something is
              wrong, raise it as QUESTION, not BUG. Tag every finding
              as one of: BUG (verified wrong), QUESTION (unsure), or
              NIT (style/preference).
            - Do not recommend hardening that does not apply. If you
              suggest a setting, name the threat it mitigates and why
              it applies here.
            - Do not dismiss CI failures as "pre-existing" or
              "unrelated" without verifying against the base branch.
            - Do not pad. Skip focus areas with nothing meaningful to
              say. If you find more than ~5 distinct issues, report
              only the strongest. A short correct review beats a long
              speculative one.

            ## Focus areas

            Code quality, security, performance, simplicity, testing, documentation.

            Provide inline comments on specific lines. Use top-level
            comments for general observations.

          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(gh release:*)"
